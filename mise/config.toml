[env]
DOTFILES = "{{ config_source | dirname | dirname }}"

[settings.dotfiles]
default_mode = "copy"
root = "{{ config_source | dirname | dirname }}"

[settings.write_targets]
dotfiles = "{{ config_source | dirname | dirname }}/mise/conf.d/dotfiles.toml"

[tasks]
bootstrap = "{{ config_source | dirname | dirname }}/scripts/post-bootstrap"
